name: bloom_go
description: The official Bloom Go Universal Development Shell for mobile development.
version: 0.6.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  bloom_framework:
    path: ../../packages/bloom_framework
  http: ^1.2.0
  mobile_scanner: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - bloom.yaml
    - .env
