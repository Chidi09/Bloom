[workspace]
members = ["."]

[package]
name = "bloom-cloud-backend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
djangors-core = "=0.7.0"
djangors-orm = "=0.7.0"
djangors-db = "=0.7.0"
djangors-rest = { version = "=0.7.0", features = ["jwt"] }
djangors-auth = "=0.7.0"
djangors-migrations = "=0.7.0"
djangors-macros = "=0.7.0"
djangors-tasks = "=0.7.0"
# Bachs + Paystack payment providers ship natively; do not hand-roll HTTP clients.
djangors-contrib-payments = "=0.7.0"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
rand = "0.8"

# djangors-core re-exports only StatusCode, not Method or Request, but tower
# Service impls (organization-resolution middleware) need hyper types directly.
# Version tracks djangors-core's own hyper 1.10.1 so the types are identical.
hyper = { version = "1.10.1", features = ["full"] }

# HTTP client for the third-party control APIs Bloom Cloud drives directly:
# Cloudflare cache purge and the Caddy admin API. Payment providers do NOT go
# through this — djangors-contrib-payments owns Bachs/Paystack natively.
# Version and feature set track djangors-contrib-payments so only one reqwest
# and one TLS backend are compiled.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# JWT signing for the mobile store APIs: ES256 with Apple's .p8 key for App Store Connect,
# and RS256 service-account assertions for the Google Play Developer API. Version and feature
# set track djangors-rest's own jwt feature so only one jsonwebtoken is compiled.
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }

# Workflow definitions are authored in YAML (PHASES.md Phase 6). NOT `serde_yaml`: upstream
# published 0.9.34+deprecated in March 2024 and is unmaintained. serde_norway is the actively
# maintained fork of it and keeps the same serde-based API.
serde_norway = "0.9.42"

# Email rendering and delivery (PHASES-FINAL.md Phase 13). djangors-mail has no
# template integration of its own -- Message.body and .html_body are plain
# Strings -- so djangors-template does the rendering and infra/mail.rs joins the
# two. Both are the framework's own crates; do not hand-roll SMTP or a renderer.
djangors-template = "=0.7.0"
djangors-mail = "=0.7.0"

# --- infra layer (src/infra) -------------------------------------------------
# Redis is used directly rather than via djangors-cache because the build/deploy
# queue needs Redis Streams consumer groups (XADD/XREADGROUP/XCLAIM) for exclusive
# claiming with a visibility timeout. djangors-cache::Cache is a get/set/delete KV
# trait and cannot express that. AI-AGENT-PRINCIPLES.md mandates this split:
# djangors-tasks for ordinary background side effects, a custom Redis queue for
# build/deploy jobs.
redis = { version = "1", features = ["tokio-comp"] }

# djangors-cache backs djangors-rest's `Throttle`, which is a get/set/delete KV use and
# therefore exactly what the Cache trait is for -- this does not revisit the queue decision
# above. The `redis` feature is enabled because we run more than one worker process and an
# in-memory counter would undercount across instances, letting an attacker multiply their
# rate limit by the number of instances.
djangors-cache = { version = "=0.7.0", features = ["redis"] }
aes-gcm = "0.10"
base64 = "0.22"
subtle = "2.5"
bytes = "1.6"
async-trait = "0.1"
aws-sdk-s3 = "1"

# --- test-only -----------------------------------------------------------------
# The billing tests build a Paystack HMAC-SHA512 webhook signature to check that a
# forged one is rejected. Production code never needs these: SHA-256 HMAC lives in
# Crypto::hmac_sha256_hex, and provider signatures are verified by
# djangors-contrib-payments itself. Both crates are already in the tree through that
# crate, so this adds no new supply-chain surface.
[dev-dependencies]
hmac = "0.12"
hex = "0.4"
