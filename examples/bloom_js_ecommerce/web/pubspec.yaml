name: bloom_ecommerce_web
description: Basic e-commerce storefront built with Bloom JS Native, talking to the bloom_ecommerce_server REST API.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  web: ^1.1.0
  http: ^1.2.0
  bloom_js_native:
    path: ../../../packages/bloom_js_native
  bloom_seo:
    path: ../../../packages/bloom_seo
  bloom_validate:
    path: ../../../packages/bloom_validate

dev_dependencies:
  lints: ^4.0.0
