name: bloom_portfolio
npm_packages:
  "@tailwindcss/browser":
    version: 4.3.3
    esm_url: https://esm.sh/@tailwindcss/browser@4.3.3?bundle
  gsap:
    version: 3.15.0
    esm_url: https://esm.sh/gsap@3.15.0?bundle
  lucide:
    version: 1.33.0
    esm_url: https://esm.sh/lucide@1.33.0?bundle
  typed.js:
    version: 3.0.0
    esm_url: https://esm.sh/typed.js@3.0.0?bundle
  lenis:
    version: 1.3.26
    esm_url: https://esm.sh/lenis@1.3.26?bundle
  github-calendar:
    version: 2.3.4
    esm_url: https://esm.sh/github-calendar@2.3.4?bundle
  "@emailjs/browser":
    version: 4.4.1
    esm_url: https://esm.sh/@emailjs/browser@4.4.1?bundle
  canvas-confetti:
    version: 1.9.4
    esm_url: https://esm.sh/canvas-confetti@1.9.4?bundle
target: web_dom

# Route the GitHub contributions fetch through our own origin.
#
# github-calendar otherwise fetches api.bloggify.net straight from the browser,
# which answers 403 with no Access-Control-Allow-Origin, so the graph fails for
# every username. Pointing it at github.com directly does not help either --
# github.com sends no CORS header of its own.
#
# CORS is a browser policy; a server-side hop is not subject to it. Proxying
# through the dev server means the browser only ever talks to its own origin,
# and the library receives exactly the HTML its parser expects, with no
# JSON-to-HTML shim in between.
proxy:
  "/gh":
    target: "https://github.com"
    strip_prefix: true
