<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom JS Native — Fine-Grained Web Architecture for Dart</title>
  <meta name="description" content="React wrapped JavaScript. Bloom JS Native wraps Dart around HTML/JS — Dart owns reactivity, compilation, and tooling; the browser owns rendering.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            carbon: {
              950: '#060608',
              900: '#09090B',
              850: '#101014',
              800: '#14141A',
              700: '#1E1E24',
              600: '#27272A',
            },
            bloom: {
              indigo: '#6366F1',
              violet: '#8B5CF6',
              cyan: '#06B6D4',
              emerald: '#10B981',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #09090B;
      color: #F4F4F5;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      overflow-x: hidden;
    }
    .glow-bg {
      background: radial-gradient(circle at 50% -20%, rgba(99, 102, 241, 0.15), transparent 70%);
    }
    .grid-pattern {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #09090B;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #27272A;
      border-radius: 3px;
    }
  </style>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-[#09090B] text-zinc-100 min-h-screen selection:bg-indigo-600 selection:text-white">
  <div id="app"></div>
  <script defer src="main.js"></script>
</body>
</html>
