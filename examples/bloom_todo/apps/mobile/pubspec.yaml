name: bloom_todo_mobile
description: Bloom Todo — production-grade task management app built on the Bloom framework.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Bloom framework packages (from pub.dev)
  bloom_framework: ^0.2.3
  bloom_ui: ^0.1.0

  # Internal workspace packages
  bloom_todo_core:
    path: ../../packages/core
  bloom_todo_ui:
    path: ../../packages/ui
  bloom_todo_config:
    path: ../../packages/config

  # Navigation & State
  go_router: ^14.8.1
  signals: ^5.3.0
  signals_flutter: ^5.3.0

  # Networking & Utilities
  http: ^1.2.0
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
