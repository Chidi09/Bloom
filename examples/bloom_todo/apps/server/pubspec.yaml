name: bloom_todo_server
description: Bloom Todo — production-grade server backend built on the Bloom framework.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  bloom_framework: ^0.2.3
  bloom_security: ^0.1.0
  bloom_db: ^0.1.0
  bloom_rest: ^0.1.0
  bloom_auth_server: ^0.1.0
  bloom_realtime: ^0.1.0
  bloom_cache: ^0.1.0
  bloom_jobs: ^0.1.0
  bloom_mail: ^0.1.0
  bloom_storage: ^0.1.0
  bloom_migrate: ^0.1.0

  # Internal workspace packages
  bloom_todo_core:
    path: ../../packages/core
  bloom_todo_config:
    path: ../../packages/config

dependency_overrides:
  bloom_framework:
    path: ../../../../packages/bloom_framework
  bloom_security:
    path: ../../../../packages/bloom_security

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
