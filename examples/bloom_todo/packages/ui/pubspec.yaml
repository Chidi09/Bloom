name: bloom_todo_ui
description: >
  Shared design-system tokens, components, and theme definitions for the
  bloom_todo mobile and web Flutter apps.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Bloom framework UI primitives (from pub.dev)
  bloom_ui: ^0.1.0

  google_fonts: ^6.2.1
  
  # Internal workspace core
  bloom_todo_core:
    path: ../core
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
