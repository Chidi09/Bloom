name: bloom_auth_server
description: Server-side authentication primitives for the Bloom framework, including password hashing, session/bearer token issuance, rate limiting, password reset workflows, and auth middleware.
version: 0.1.0
homepage: https://bloom.dev
repository: https://github.com/bloom-framework/bloom
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  bloom_framework:
    path: ../bloom_framework
  bcrypt: ^1.1.3
  crypto: ^3.0.3
  dart_jsonwebtoken: ^3.4.1
  meta: ^1.15.0

dev_dependencies:
  flutter_lints: ^5.0.0
  test: ^1.25.0
