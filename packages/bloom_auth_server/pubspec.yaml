name: bloom_auth_server
description: Server-side authentication primitives for the Bloom framework, including password hashing, session/bearer token issuance, rate limiting, password reset workflows, and auth middleware.
version: 0.3.0
repository: https://github.com/Chidi09/Bloom
issue_tracker: https://github.com/Chidi09/Bloom/issues
topics:
  - bloom
  - auth
  - jwt

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  bloom_server: ^0.1.0
  bcrypt: ^1.1.3
  crypto: ^3.0.3
  dart_jsonwebtoken: ^3.4.1
  meta: ^1.15.0
  http: ^1.2.0

dev_dependencies:
  flutter_lints: ^5.0.0
  test: ^1.25.0

# Local monorepo wiring. `dependency_overrides` is ignored by `dart pub publish`
# and by consumers of the published package, so the hosted constraint above is
# what ships; this keeps an in-tree checkout building against sibling sources.
dependency_overrides:
  bloom_server:
    path: ../bloom_server
  bloom_seo:
    path: ../bloom_seo
  bloom_js_native:
    path: ../bloom_js_native
