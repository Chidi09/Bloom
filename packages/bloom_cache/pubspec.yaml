name: bloom_cache
description: Server-side caching abstraction and backends (In-Memory LRU, Database, Redis) with HTTP response caching middleware for Bloom applications.
version: 0.1.0
homepage: https://bloom.dev
repository: https://github.com/bloom-framework/bloom
issue_tracker: https://github.com/bloom-framework/bloom/issues
topics:
  - bloom
  - cache
  - redis

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  meta: ^1.15.0
  redis: ^4.1.0
  bloom_server:
    path: ../bloom_server
  bloom_db: ^0.1.0

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^5.0.0
