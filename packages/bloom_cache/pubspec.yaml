name: bloom_cache
description: Server-side caching abstraction and backends (In-Memory LRU, Database, Redis) with HTTP response caching middleware for Bloom applications.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  meta: ^1.15.0
  redis: ^4.1.0
  bloom_framework:
    path: ../bloom_framework
  bloom_db:
    path: ../bloom_db

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^5.0.0
