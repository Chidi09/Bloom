name: bloom_cli
description: The official command-line interface for the Bloom application framework and developer platform.
version: 0.3.0
homepage: https://bloom.dev
repository: https://github.com/bloom-framework/bloom
issue_tracker: https://github.com/bloom-framework/bloom/issues
topics:
  - cli
  - developer-tools
  - flutter
  - framework

environment:
  sdk: '>=3.3.0 <4.0.0'

executables:
  bloom: bloom

dependencies:
  args: ^2.5.0
  path: ^1.9.0
  crypto: ^3.0.3
  yaml: ^3.1.2
  yaml_edit: ^2.2.0
  xml: ^6.5.0
  qr: ^3.0.2
  http: ^1.2.0
  http_parser: ^4.0.2
  archive: ^4.0.9
  image: ^4.3.0
  puppeteer: ^3.26.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
