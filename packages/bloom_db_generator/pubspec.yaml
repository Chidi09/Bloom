name: bloom_db_generator
description: build_runner code generator for bloom_db models — generates ModelMeta and row-mapping boilerplate from @BloomModel annotations.
version: 0.1.0
homepage: https://bloom.dev
repository: https://github.com/bloom-framework/bloom
issue_tracker: https://github.com/bloom-framework/bloom/issues
topics:
  - bloom
  - orm
  - codegen
  - build-runner

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  analyzer: ^6.4.1
  build: ^2.4.1
  source_gen: ^1.5.0
  bloom_db: ^0.1.0

dev_dependencies:
  build_runner: ^2.4.9
  build_test: ^2.2.2
  test: ^1.25.0
  lints: ^4.0.0
