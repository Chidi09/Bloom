name: bloom_framework
description: An opinionated application framework and developer platform built on Dart and Flutter.
version: 0.3.1
publish_to: none
repository: https://github.com/Chidi09/Bloom
issue_tracker: https://github.com/Chidi09/Bloom/issues
topics:
  - framework
  - state-management
  - full-stack
  - mobile
  - flutter

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  crypto: ^3.0.3
  path: ^1.9.0
  signals: ^5.5.0
  signals_flutter: ^5.5.0
  go_router: ^14.8.0
  yaml: ^3.1.2
  meta: ^1.15.0
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3
  image_picker: ^1.1.2
  shorebird_code_push: ^2.0.7
  supabase_flutter: ^2.17.1
  web: ^1.1.0
  bloom_js_native: ^0.2.0
  bloom_seo: ^0.1.1
  bloom_server: ^0.2.0

dev_dependencies:
  flutter_lints: ^5.0.0

# Local monorepo wiring. bloom_framework itself is `publish_to: none`, but its
# dependencies must still be declared as HOSTED: projects scaffolded by
# `bloom create-module --framework-path` depend on this package by path, and pub
# refuses to resolve one package (bloom_js_native) from two different sources.
# Since sibling bloom_seo now declares a hosted bloom_js_native, declaring a path
# one here would make every scaffolded module unresolvable.
dependency_overrides:
  bloom_js_native:
    path: ../bloom_js_native
  bloom_seo:
    path: ../bloom_seo
  bloom_server:
    path: ../bloom_server
