name: bloom_i18n
description: Internationalization, locale resolution, ICU message formatting, and date localization for Bloom applications.
version: 0.1.0
homepage: https://bloom.dev
repository: https://github.com/bloom-framework/bloom
issue_tracker: https://github.com/bloom-framework/bloom/issues
topics:
  - bloom
  - i18n
  - localization

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  bloom_framework: ^0.2.2
  intl: ^0.19.0
  meta: ^1.15.0

dev_dependencies:
  flutter_lints: ^5.0.0
  test: ^1.25.0
