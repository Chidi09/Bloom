name: bloom_js_native
description: React-wrapped JavaScript, Dart-wrapped reactivity. Fine-grained DOM framework — Dart owns signals & tooling, the browser owns rendering.
version: 0.3.4
repository: https://github.com/Chidi09/Bloom
issue_tracker: https://github.com/Chidi09/Bloom/issues
topics:
  - bloom
  - web
  - dom
  - signals
  - ssr

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  # signals_core rather than signals: the `signals` umbrella package depends on
  # the Flutter SDK, which would force every consumer of this package -- including
  # server-side rendering -- to be a Flutter app. signals_core is the same
  # reactivity engine with no dependencies at all.
  signals_core: ^5.5.0
  web: ^1.1.0
  meta: ^1.15.0
  http: ^1.2.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
  build_runner: ^2.4.0
  build_web_compilers: ^4.0.0
