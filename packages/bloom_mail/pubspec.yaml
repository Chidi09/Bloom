name: bloom_mail
description: Transactional email sending for Bloom server applications with swappable delivery backends.
version: 0.3.0
repository: https://github.com/Chidi09/Bloom
issue_tracker: https://github.com/Chidi09/Bloom/issues
topics:
  - bloom
  - email
  - smtp

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  bloom_server: ^0.1.0
  mailer: ^6.1.2

dev_dependencies:
  flutter_lints: ^5.0.0
  test: ^1.25.0

# Local monorepo wiring. `dependency_overrides` is ignored by `dart pub publish`
# and by consumers of the published package, so the hosted constraint above is
# what ships; this keeps an in-tree checkout building against sibling sources.
dependency_overrides:
  bloom_server:
    path: ../bloom_server
  bloom_seo:
    path: ../bloom_seo
  bloom_js_native:
    path: ../bloom_js_native
