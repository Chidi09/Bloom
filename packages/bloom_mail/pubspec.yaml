name: bloom_mail
description: Transactional email sending for Bloom server applications with swappable delivery backends.
version: 0.1.0
homepage: https://bloom.dev
repository: https://github.com/bloom-framework/bloom
issue_tracker: https://github.com/bloom-framework/bloom/issues
topics:
  - bloom
  - email
  - smtp

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  bloom_server:
    path: ../bloom_server
  mailer: ^6.1.2

dev_dependencies:
  flutter_lints: ^5.0.0
