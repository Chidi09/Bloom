name: bloom_rest
description: DRF-style (Django REST Framework) REST layer on top of BloomApiRouter and bloom_db, providing serializers, ViewSets, pagination, filters, permissions, and throttling.
version: 0.2.2
repository: https://github.com/Chidi09/Bloom
issue_tracker: https://github.com/Chidi09/Bloom/issues
topics:
  - bloom
  - rest
  - server

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  meta: ^1.15.0
  bloom_server: ^0.2.0
  bloom_db: ^0.1.0
  bloom_cache: ^0.2.0

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0

# Local monorepo wiring. `dependency_overrides` is ignored by `dart pub publish`
# and by consumers of the published package, so the hosted constraints above are
# what ship; these keep an in-tree checkout building against sibling sources.
#
# The bloom_cache constraint above is ^0.2.0 because 0.2.0 is the first release
# ported off the Flutter-requiring bloom_framework and onto bloom_server; ^0.1.0
# would have silently re-acquired Flutter transitively.
dependency_overrides:
  bloom_server:
    path: ../bloom_server
  bloom_db:
    path: ../bloom_db
  bloom_cache:
    path: ../bloom_cache
  bloom_seo:
    path: ../bloom_seo
  bloom_js_native:
    path: ../bloom_js_native
