  - seo
  - metadata
  - sitemap
  - ssr

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  signals: ^5.5.0
  bloom_js_native:
    path: ../bloom_js_native

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
