name: bloom_seo
description: Reactive document metadata, JSON-LD structured data, XML sitemaps, and SSG prerendering for Bloom JS Native and server.
version: 0.1.1
repository: https://github.com/Chidi09/Bloom
issue_tracker: https://github.com/Chidi09/Bloom/issues
topics:
  - bloom
  - seo
  - metadata
  - sitemap
  - ssr

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  # See the note in bloom_js_native/pubspec.yaml: signals pulls in the Flutter SDK.
  signals_core: ^5.5.0
  bloom_js_native: ^0.2.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

# Local monorepo wiring. `dependency_overrides` is ignored by `dart pub publish`
# and by consumers of the published package, so the hosted constraints above are
# what ship; these keep an in-tree checkout building against sibling sources.
dependency_overrides:
  bloom_js_native:
    path: ../bloom_js_native
