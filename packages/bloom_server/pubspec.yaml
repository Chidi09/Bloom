name: bloom_server
description: Flutter-free Dart web server for full-stack apps — HTTP APIs, routing, middleware, SSR, SSG/ISR delivery, env config, and DI. Pairs with bloom_js_native.
version: 0.2.0
repository: https://github.com/Chidi09/Bloom
issue_tracker: https://github.com/Chidi09/Bloom/issues
topics:
  - bloom
  - server
  - http
  - ssr

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  bloom_js_native: ^0.3.0
  bloom_seo: ^0.2.0

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0

# Local monorepo wiring. `dependency_overrides` is ignored by `dart pub publish`
# and by consumers of the published package, so the hosted constraints above are
# what ship; these keep an in-tree checkout building against sibling sources.
dependency_overrides:
  bloom_js_native:
    path: ../bloom_js_native
  bloom_seo:
    path: ../bloom_seo
